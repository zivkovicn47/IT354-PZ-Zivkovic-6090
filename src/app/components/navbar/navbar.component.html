<nav class="bg-blue-700 shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center gap-4">

      @if (showBack()) {
        <a routerLink="/"
          class="flex items-center gap-2 text-white hover:opacity-80 transition group focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded-lg">
          <span class="bg-white/10 p-1.5 rounded-lg group-hover:bg-white/20 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </span>
          <span class="font-bold text-lg tracking-tight">Nazad na pretragu</span>
        </a>
      } @else {
        <a routerLink="/" class="flex-shrink-0 flex items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded-lg">
          <span class="bg-white text-blue-700 p-1.5 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </span>
          <span class="font-bold text-xl tracking-tight text-white">PolovniAutomobili</span>
        </a>
      }

      <div class="flex items-center gap-3 sm:gap-4 text-blue-100">
        @if (authService.currentUser(); as user) {
          <a routerLink="/my-ads"
            class="hidden sm:inline hover:text-white transition font-medium text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded px-1">
            Moji oglasi
          </a>
          <a routerLink="/add-car"
            class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Prodaj
          </a>
          <button type="button" (click)="logout()"
            [title]="user.email ?? ''"
            class="hover:text-white transition font-medium text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded px-1">
            Odjavi se
          </button>
        } @else {
          <a routerLink="/login"
            class="hover:text-white transition font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded px-1">
            Prijava
          </a>
        }
      </div>
    </div>
  </div>
</nav>
